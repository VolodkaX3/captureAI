<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="ai_panel.css">
    <title>AI</title>
</head>
<body>
    <div id="stage">
        <canvas id="scene"></canvas>
        <video id="feed" muted playsinline></video>
        <div id="glass"></div>
    </div>

    <div id="front">
        <div class="tint"></div>
        <div class="row">
            <div class="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round">
                    <circle cx="10.5" cy="10.5" r="6.5"></circle>
                    <path d="M15.5 15.5L21 21"></path>
                </svg>
                <span>Search</span>
            </div>
            <button class="send" id="send-btn" title="Send">
                <img src="../screenshot_wrapper/imgs/SendButton.png" alt="Send">
            </button>
        </div>
    </div>

    <script type="module" src="ai_panel.js"></script>
</body>
</html>
