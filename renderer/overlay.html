<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
    <div id="container">
<!-- это панелька (и да клод пидор поэтому мне надо писать все самому сука)-->
        <div id="panel">
          <!-- панель кнопки чат-->
      <div id="chat-panel" class="hidden">
        <div class="settings-header">
          <span></span>
          <button class="icon-btn small" id="btn-chat-close" title="Close chat">X</button>
        </div>
        <div class="settings-body"></div>
      </div>    
      <!-- панель кнопки настроек-->      
      <div id="settings-panel" class="hidden">
        <div class="settings-header">
          <span>Settings</span>
          <button class="icon-btn small" id="btn-settings-close" title="Close settings">✕</button>
        </div>
        <div class="settings-body">
          <p>КЛОД ПИДОР НУ А Я ХОРОШ</p>
        </div>
      </div>
    </div>

    <div id="side-panel">
      <div id="button-panel">
        <button class="icon-btn" id="btn-shot" title="Screenshot">
          <img src="img/ShotButton1W.png" alt="Shot">
        </button>
        <button class="icon-btn" id="btn-settings" title="Settings">
          <img src="img/SettingsButton1W.png" alt="Settings">
        </button>
        <button class="icon-btn" id="btn-chat" title="Chat">
          <img src="img/ChatButtonW.png" alt="Chat">
        </button>
        <button class="icon-btn" id="btn-close" title="Close">
          <img src="img/CloseButton1W.png" alt="Close">
        </button>
        
        <!-- Чтобы добавить кнопку позже: скопируй один блок <button class="icon-btn">,
             дай новый id и иконку, затем добавь обработчик в overlay.js -->
      </div>
    </div>
  </div>
</div>  
  <script src="overlay.js"></script>
</body>
</html>
